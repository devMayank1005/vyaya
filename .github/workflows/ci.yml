name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Shared core on the JVM: unit tests, property tests and the coverage gate.
  core-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew jvmTest koverVerify --console=plain
      - if: always()
        run: python3 scripts/test-summary.py jvmTest

  # Shared core compiled and tested for iOS (CLAUDE.md rule 8.6: no platform code in core).
  core-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew iosSimulatorArm64Test --console=plain
      - if: always()
        run: python3 scripts/test-summary.py iosSimulatorArm64Test
