name: Release check

# Launch report FLAW-001: the minified build is run on an emulator before a release: the instrumented tests on `staging`
# (the release setup; backup, CSV, capture, app lock, budget alert) and the smoke test of the play release. Too slow
# for every PR, so on release tags and on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minified-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build
        run: ./gradlew :androidApp:assemblePlayStaging :androidApp:assemblePlayStagingAndroidTest :androidApp:assemblePlayRelease -Pvyaya.testJdk=21 --console=plain
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :androidApp:connectedPlayStagingAndroidTest -Pvyaya.testJdk=21 --console=plain
            python3 scripts/test-summary.py connected
            scripts/release-smoke.sh
