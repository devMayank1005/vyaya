name: Release check

# Launch report FLAW-001: the minified build is run on an emulator before a release: the instrumented tests on `staging`
# (the release setup; backup, CSV, capture, app lock, budget alert) and the smoke test of the play release. Too slow
# for every PR, so on release tags and on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minified-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build
        run: ./gradlew :androidApp:assemblePlayStaging :androidApp:assemblePlayStagingAndroidTest :androidApp:assemblePlayRelease -Pvyaya.testJdk=21 --console=plain
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :androidApp:connectedPlayStagingAndroidTest -Pvyaya.testJdk=21 --console=plain
            python3 scripts/test-summary.py connected
            scripts/release-smoke.sh
